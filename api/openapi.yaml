# Passo 5: contrato OpenAPI da API REST.
openapi: 3.0.3
info:
  title: Do Campo à Mesa API
  version: 0.1.0
  description: |
    Mercado digital de produtores locais.

    ## Eventos Socket.io
    A ligação usa o mesmo servidor HTTP e recebe o JWT em `auth.token` no handshake.
    A expiração encerra a ligação. Os eventos seguintes usam Socket.io.

    | Direção | Evento | Dados e comportamento |
    | --- | --- | --- |
    | Cliente → servidor | `entrar`, `sair` | Identificador do leilão. Adere à sala ou sai dela. |
    | Cliente → servidor | `licitar` | `{ leilaoId, valor }`. Exclusivo de compradores. Requer leilão ativo dentro do prazo e valor igual ou superior ao valor atual mais o incremento. O valor é positivo e representável em cêntimos. |
    | Servidor → cliente | Confirmação de `licitar` | Ack `{ ok: true, valor, licitacao }` após a transação ou `{ ok: false, erro }` em caso de recusa. Sem callback de ack, a recusa chega por `recusada`. |
    | Servidor → cliente | `recusada` | Mensagem de erro da sala, recusa de licitação sem ack ou sessão expirada. |
    | Servidor → cliente | `estado` | `{ agora, leilao, licitacoes }`, com a hora do servidor e até 20 licitações recentes. |
    | Servidor → sala | `presenca`, `nova-licitacao` | Número de ligações na sala ou licitação confirmada com `_id`, `leilaoId`, `valor`, `comprador`, `nome`, `createdAt` e `numLicitacoes`. |
    | Servidor → sala | `aberto`, `terminado` | A abertura envia `{ id }`. O fecho envia `{ id, lote, vencedor, valor, numLicitacoes }`. `vencedor` contém `id` e `nome` ou é `null`. |
    | Servidor → destinatário | `leilao-ganho`, `leilao-terminado` | Resultado do fecho com o campo `encomenda` para o vencedor e para o produtor, respetivamente. |
    | Servidor → destinatário | `nova-encomenda`, `encomenda-atualizada` | Aviso ao produtor com `{ id, total }` ou ao comprador com `{ id, estado, produtor }`, respetivamente. |
    | Servidor → destinatário | `conta-validada`, `painel-atualizado` | Aviso de aprovação ao produtor ou sinal de atualização com o recurso afetado. A rejeição é comunicada ao próprio produtor. |
servers:
  - url: /api
    description: API no mesmo servidor que disponibiliza o Swagger UI
security: []
tags:
  - { name: Serviço, description: Estado da API }
  - { name: Autenticação, description: Registo e autenticação com JWT }
  - { name: Produtos, description: Catálogo e gestão dos produtos }
  - { name: Produtores, description: Consulta e edição de perfis de produtores }
  - { name: Encomendas, description: Compras e acompanhamento dos estados }
  - { name: Leilões, description: Consulta e criação de leilões pela API REST }
  - { name: Avaliações, description: Avaliações após entrega e denúncias }
  - { name: Administração, description: Operações exclusivas do administrador }

paths:
  /health:
    get:
      tags: [Serviço]
      operationId: consultarEstadoApi
      summary: Verificar que a API responde
      description: Confirma a resposta HTTP do serviço; não verifica a ligação à base de dados.
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, enum: [ok] }
              example: { estado: ok }

  /auth/registo:
    post:
      tags: [Autenticação]
      operationId: registarUtilizador
      summary: Registar comprador ou produtor
      description: |
        Cria uma conta com password guardada como hash bcrypt de custo 12.
        Normaliza o email para minúsculas e retira os espaços nas extremidades.
        O papel é comprador quando omitido; não permite criar administradores.
        Um produtor precisa de nomeExploracao e localidade. O servidor define estadoValidacao=pendente
        e validado=false. Os campos não permitidos são ignorados.
        Devolve apenas o identificador da conta; é necessário fazer login para obter o JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistoInput' }
      responses:
        '201':
          description: Utilizador criado
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { $ref: '#/components/schemas/ObjectId' }
              example: { id: 66f5a1c2e4b0a1b2c3d4e5f6 }
        '400':
          description: Dados inválidos, password fora dos limites, papel não permitido ou dados do produtor em falta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                password:
                  value: { erro: A password deve ter pelo menos 8 caracteres e no máximo 72 bytes }
                papel:
                  value: { erro: Papel inválido }
                produtor:
                  value: { erro: Indique o nome da exploração e a localidade }
        '409':
          description: Já existe uma conta com o email normalizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Já existe um registo com esses dados }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /auth/login:
    post:
      tags: [Autenticação]
      operationId: autenticarUtilizador
      summary: Iniciar sessão
      description: |
        Normaliza o email e compara a password com o hash bcrypt guardado.
        Um email desconhecido e uma password incorreta devolvem a mesma mensagem 401.
        Devolve um JWT assinado com HS256 e os dados públicos do utilizador, sem passwordHash.
        O JWT contém id, papel e nome, além de iat e exp. Expira em duas horas por omissão,
        com duração configurável em JWT_EXPIRES_IN.
        Produtores pendentes, aprovados ou rejeitados podem iniciar sessão com credenciais válidas.
        A criação de produtos e leilões exige aprovação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Sessão iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400':
          description: Email ou password ausentes, vazios ou com tipo inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Indique o email e a password }
        '401':
          description: Email desconhecido ou password incorreta; também rejeita passwords com mais de 72 bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Credenciais inválidas }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /auth/eu:
    get:
      tags: [Autenticação]
      operationId: consultarSessao
      summary: Consultar o utilizador autenticado
      description: |
        Exige JWT válido de qualquer papel. Consulta os dados atuais da conta na base de dados,
        incluindo a validação do produtor, e devolve o formato público com id, sem passwordHash.
        Devolve 401 quando o token é inválido/expirado ou a conta já não existe.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dados atuais do utilizador autenticado
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPrivado' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublico' }
        '401':
          description: JWT inválido, expirado ou em falta, ou conta inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                token:
                  value: { erro: "Token inválido ou em falta" }
                conta:
                  value: { erro: "Utilizador não encontrado" }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /products:
    get:
      tags: [Produtos]
      operationId: pesquisarProdutos
      summary: Pesquisar produtos de produtores validados
      description: Combina os filtros indicados. A pesquisa por texto é literal e ignora maiúsculas/minúsculas. A localidade é comparada pelo valor exato.
      parameters:
        - { name: q, in: query, description: Texto no nome ou na descrição do produto ou no nome do produtor, schema: { type: string }, example: mel }
        - name: categoria
          in: query
          description: Nome exato da categoria. Todos ou um valor vazio desativa o filtro.
          schema: { type: string, example: Fruta }
        - name: precoMax
          in: query
          description: Limite inclusivo, não negativo e representável em cêntimos. Use ponto decimal, com até duas casas. O valor vazio desativa o filtro.
          schema: { type: string, pattern: '^(?:\s*(?:\d+(?:\.\d{0,2})?|\.\d{1,2})\s*)?$' }
          example: '10.50'
        - { name: bio, in: query, description: true limita a produtos biológicos; false não aplica este filtro, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Produtor' }
        - { $ref: '#/components/parameters/Localidade' }
        - { name: epoca, in: query, description: Nome exato da época, schema: { type: string, example: Outono } }
        - name: ordenar
          in: query
          description: Ordena por nome, data de criação decrescente ou preço crescente/decrescente. Em caso de empate usa o identificador. Aceita também preco_asc e preco_desc.
          schema: { type: string, enum: [nome, recentes, preco-asc, preco-desc, preco_asc, preco_desc], default: recentes }
      responses:
        '200':
          description: Produtos encontrados; lista vazia quando nenhum corresponde aos filtros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductLista' }
        '400':
          description: Query inválida, produtor malformado, preço, modo biológico ou ordenação inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                query:
                  value: { erro: "Parâmetros de pesquisa inválidos" }
                preco:
                  value: { erro: "Preço máximo inválido. Use até duas casas decimais" }
                bio:
                  value: { erro: "Filtro biológico inválido" }
                ordenar:
                  value: { erro: "Ordenação inválida" }
        '500': { $ref: '#/components/responses/ErroInterno' }
    post:
      tags: [Produtos]
      operationId: criarProduto
      summary: Criar produto
      description: Exige papel produtor e conta aprovada. O produtor é obtido do JWT; a imagem é enviada pela operação de upload.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Produto criado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductGravacao' }
        '400':
          description: Dados do produto inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                preco:
                  value: { erro: "Preço deve ser representável em cêntimos, com no máximo duas casas decimais" }
                stock:
                  value: { erro: "Dados inválidos", detalhes: { stock: "O stock tem de ser um número inteiro" } }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403':
          description: Papel sem permissão ou conta do produtor por aprovar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                papel:
                  value: { erro: "Sem permissão" }
                pendente:
                  value: { erro: "O produtor ainda não foi validado" }
                rejeitado:
                  value: { erro: "A conta de produtor foi rejeitada" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /products/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Produtos]
      operationId: consultarProduto
      summary: Consultar um produto público
      responses:
        '200': { $ref: '#/components/responses/ProdutoDetalhe' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '404':
          description: Produto inexistente ou de produtor não validado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Produto não encontrado" }
        '500': { $ref: '#/components/responses/ErroInterno' }
    put:
      tags: [Produtos]
      operationId: atualizarProduto
      summary: Atualizar os campos indicados de um produto próprio
      description: |
        Exige papel produtor e propriedade do produto. Aceita uma atualização parcial,
        com pelo menos um campo editável. Não altera o produtor nem a imagem.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
            example: { preco: 2.8, stock: 250 }
      responses:
        '200': { $ref: '#/components/responses/ProdutoGravado' }
        '400':
          description: Identificador ou dados do produto inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                id:
                  value: { erro: "Identificador ou valor inválido" }
                campos:
                  value: { erro: "Indique os dados do produto" }
                preco:
                  value: { erro: "Preço deve ser representável em cêntimos, com no máximo duas casas decimais" }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Produto inexistente ou de outro produtor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Produto não encontrado" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }
    delete:
      tags: [Produtos]
      operationId: removerProduto
      summary: Remover um produto próprio
      description: Exige papel produtor. Um produto inexistente ou de outro produtor devolve 404.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/SemConteudo' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Produto inexistente ou de outro produtor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Produto não encontrado" }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /products/{id}/imagem:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Produtos]
      operationId: enviarImagemProduto
      summary: Enviar uma imagem para um produto próprio
      description: |
        Exige papel produtor e propriedade do produto. Envie um ficheiro no campo imagem.
        A assinatura do ficheiro tem de corresponder a JPEG, PNG ou WebP. O tamanho tem de ser inferior a 5 MiB.
        Um upload bem-sucedido associa ao produto o novo URL em /uploads, substituindo a referência anterior.
        A resposta 413 aplica-se apenas a corpos JSON acima do limite global.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem: { type: string, format: binary, description: 'Ficheiro JPEG, PNG ou WebP' }
      responses:
        '200':
          description: Imagem guardada e associada ao produto
          content:
            application/json:
              schema:
                type: object
                required: [imagemUrl]
                properties:
                  imagemUrl: { type: string, format: uri, example: 'http://localhost:3000/uploads/24ac1b9e-bbb3-4c04-a59f-4434a03996e9.png' }
        '400':
          description: Identificador inválido, ficheiro em falta, formato rejeitado ou limite de tamanho atingido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                id:
                  value: { erro: "Identificador ou valor inválido" }
                campo:
                  value: { erro: "Envie uma imagem no campo imagem" }
                formato:
                  value: { erro: "Use uma imagem JPEG, PNG ou WebP" }
                tamanho:
                  value: { erro: "Imagem demasiado grande (máximo 5 MB)" }
                multipart:
                  value: { erro: "Upload inválido" }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Produto inexistente ou de outro produtor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Produto não encontrado" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /producers:
    get:
      tags: [Produtores]
      operationId: listarProdutores
      summary: Listar os produtores validados
      parameters:
        - { $ref: '#/components/parameters/Localidade' }
      responses:
        '200':
          description: Produtores ordenados por nome, com dados públicos da exploração
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProdutorPublico' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /producers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Produtores]
      operationId: consultarProdutor
      summary: Consultar a página pública de um produtor validado
      description: |
        Inclui os produtos, as últimas 20 avaliações visíveis e a média de todas as avaliações visíveis.
        A média é null quando não existem avaliações visíveis. Com JWT válido de qualquer papel,
        cada avaliação indica denunciadaPorMim. Um token fornecido e inválido devolve 401.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Página pública do produtor
          headers:
            Vary: { schema: { type: string }, example: Authorization }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaProdutor' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404':
          description: Produtor inexistente ou não validado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Produtor não encontrado" }
        '500': { $ref: '#/components/responses/ErroInterno' }
    patch:
      tags: [Produtores]
      operationId: atualizarPerfilProdutor
      summary: Atualizar os campos públicos do próprio perfil
      description: |
        Exige papel produtor e que o id corresponda à conta do JWT. A conta pode estar
        pendente, aprovada ou rejeitada. Um id de outra conta ou uma conta inexistente devolve 404.
        Envie pelo menos um campo editável. Campos fora do esquema devolvem 400.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilProdutorUpdate' }
            example: { nomeExploracao: Horta da Ribeira, localidade: Ponte de Lima }
      responses:
        '200':
          description: Perfil atualizado no formato da conta autenticada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPublico' }
        '400':
          description: Identificador inválido, corpo vazio, campo não editável ou valor inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                campos:
                  value: { erro: Indique apenas os campos públicos do perfil }
                valor:
                  value: { erro: Valor inválido para nome }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Produtor inexistente ou de outro utilizador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Produtor não encontrado }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /orders:
    get:
      tags: [Encomendas]
      operationId: listarEncomendas
      summary: Listar as encomendas do utilizador autenticado
      description: |
        Um produtor vê as encomendas recebidas. Compradores e administradores veem apenas as próprias compras.
        Ordenação da mais recente para a mais antiga.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Encomendas do utilizador
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderLeitura' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '500': { $ref: '#/components/responses/ErroInterno' }
    post:
      tags: [Encomendas]
      operationId: criarEncomendas
      summary: Encomendar os artigos do carrinho
      description: |
        Exige papel comprador. Agrupa os artigos numa encomenda por produtor.
        Os nomes, preços e unidades vêm do catálogo. As linhas repetidas do mesmo produto
        são somadas e as quantidades agregadas têm de ser inteiros seguros. O stock e todas
        as encomendas são gravados na mesma transação MongoDB, com reserva condicionada ao stock disponível.
        Se a transação falhar, nenhuma reserva nem encomenda do pedido fica gravada.

        A chave opcional Idempotency-Key é válida por comprador. Para a mesma chave e dados
        equivalentes, a API devolve 201 e as encomendas já registadas, sem voltar a descontar stock
        ou a notificar os produtores. A equivalência usa as quantidades agregadas por produto e a
        entrega normalizada. Usar a mesma chave com dados diferentes ou pedir stock insuficiente devolve 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
            example:
              linhas:
                - { produto: 66f5a1c2e4b0a1b2c3d4e5f6, quantidade: 2 }
                - { produto: 66f5a1c2e4b0a1b2c3d4e5f7, quantidade: 1 }
              entrega: { tipo: entrega, morada: 'Rua de exemplo, Ponte de Lima' }
      responses:
        '201':
          description: Uma encomenda por produtor, criada agora ou recuperada pela chave de idempotência
          headers:
            Location:
              description: Coleção de encomendas
              schema: { type: string, example: /api/orders }
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/OrderGravacao' }
              example:
                - _id: 66f5a1c2e4b0a1b2c3d4e601
                  id: 66f5a1c2e4b0a1b2c3d4e601
                  comprador: 66f5a1c2e4b0a1b2c3d4e600
                  produtor: 66f5a1c2e4b0a1b2c3d4e611
                  linhas:
                    - { _id: 66f5a1c2e4b0a1b2c3d4e621, id: 66f5a1c2e4b0a1b2c3d4e621, produto: 66f5a1c2e4b0a1b2c3d4e5f6, nome: Kiwi Hayward, precoUnit: 2.4, unidade: kg, quantidade: 2 }
                  estado: pendente
                  entrega: { tipo: entrega, morada: 'Rua de exemplo, Ponte de Lima' }
                  origem: loja
                  total: 4.8
                - _id: 66f5a1c2e4b0a1b2c3d4e602
                  id: 66f5a1c2e4b0a1b2c3d4e602
                  comprador: 66f5a1c2e4b0a1b2c3d4e600
                  produtor: 66f5a1c2e4b0a1b2c3d4e612
                  linhas:
                    - { _id: 66f5a1c2e4b0a1b2c3d4e622, id: 66f5a1c2e4b0a1b2c3d4e622, produto: 66f5a1c2e4b0a1b2c3d4e5f7, nome: Mel, precoUnit: 6.5, unidade: frasco, quantidade: 1 }
                  estado: pendente
                  entrega: { tipo: entrega, morada: 'Rua de exemplo, Ponte de Lima' }
                  origem: loja
                  total: 6.5
        '400':
          description: Corpo, artigos, entrega ou chave de checkout inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                chave:
                  value: { erro: "Chave de checkout inválida" }
                quantidade:
                  value: { erro: "Quantidade inválida" }
                morada:
                  value: { erro: "Indique a morada de entrega" }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Produto inexistente ou indisponível para checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Produto não encontrado" }
        '409':
          description: Stock insuficiente ou chave reutilizada com dados diferentes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                stock:
                  value: { erro: "Stock insuficiente: Kiwi Hayward" }
                chave:
                  value: { erro: "Esta chave de checkout já foi utilizada com outros dados" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /orders/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Encomendas]
      operationId: consultarEncomenda
      summary: Consultar uma encomenda do utilizador autenticado
      description: Exige ser o comprador ou, no papel produtor, o produtor da encomenda. Devolve 404 para encomendas de terceiros.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Encomenda' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404':
          description: Encomenda inexistente ou de outro utilizador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Encomenda não encontrada" }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /orders/{id}/estado:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Encomendas]
      operationId: atualizarEstadoEncomenda
      summary: Avançar o estado de uma encomenda recebida
      description: |
        Exige papel produtor e propriedade da encomenda.
        A sequência é pendente, confirmada, pronta, entregue.
        Pode avançar para qualquer estado posterior; repetir ou recuar devolve 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoEncomenda' }
            example: { estado: confirmada }
      responses:
        '200': { $ref: '#/components/responses/EncomendaGravada' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Encomenda inexistente ou de outro produtor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Encomenda não encontrada" }
        '409':
          description: O novo estado tem de ser posterior ao atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "O estado só pode avançar" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /auctions:
    get:
      tags: [Leilões]
      operationId: listarLeiloes
      summary: Listar leilões
      description: |
        Ordena por data de fim e desempata por identificador. Os filtros estado e produtor podem ser combinados.
        Devolve o estado persistido. Quando o ciclo automático está ativo, abre os leilões agendados
        na data de início e termina os ativos no fim do prazo. Se houver vencedor, é criada uma
        encomenda confirmada e o leilão passa a incluir a referência encomenda.
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoLeilao' } }
        - { $ref: '#/components/parameters/Produtor' }
      responses:
        '200':
          description: Leilões encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuctionLeitura' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '500': { $ref: '#/components/responses/ErroInterno' }
    post:
      tags: [Leilões]
      operationId: criarLeilao
      summary: Criar um leilão
      description: |
        Exige papel produtor e conta aprovada. O produto, se indicado, tem de pertencer ao produtor.
        Indique duracao em minutos (mínimo de um) ou terminaEm. A duração tem prioridade.
        Os valores monetários têm de ser representáveis em cêntimos, com até duas casas decimais.
        O início é agora quando iniciaEm é omitido. O fim tem de ser posterior ao início e ao momento atual.
        O servidor define agendado se o início for futuro e ativo nos outros casos. O valor inicial
        de licitacaoAtual é precoBase e ainda não existe comprador.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuctionInput' }
      responses:
        '201':
          description: Leilão criado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionGravacao' }
        '400':
          description: Dados do leilão, montantes, duração ou datas inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                valores:
                  value: { erro: "Indique valores monetários válidos, com no máximo duas casas decimais" }
                duracao:
                  value: { erro: "Duração inválido" }
                datas:
                  value: { erro: "Datas do leilão inválidas" }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403':
          description: Papel sem permissão ou conta do produtor por aprovar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                papel:
                  value: { erro: "Sem permissão" }
                pendente:
                  value: { erro: "O produtor ainda não foi validado" }
                rejeitado:
                  value: { erro: "A conta de produtor foi rejeitada" }
        '404':
          description: Produto inexistente ou de outro produtor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Produto não encontrado" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /auctions/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Leilões]
      operationId: consultarLeilao
      summary: Consultar um leilão com as últimas 20 licitações
      responses:
        '200':
          description: Leilão e histórico com o nome do comprador e a data de cada licitação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuctionDetalhe' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '404':
          description: Leilão inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Leilão não encontrado" }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /auctions/{id}/bids:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Leilões]
      operationId: listarLicitacoes
      summary: Consultar todo o histórico de licitações de um leilão
      description: Da licitação mais recente à mais antiga, com desempate por ID decrescente. As licitações são submetidas por Socket.io.
      responses:
        '200':
          description: Licitações com _id e nome do comprador, ou null se a referência já não existir
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bid' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '404':
          description: Leilão inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Leilão não encontrado" }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /reviews:
    get:
      tags: [Avaliações]
      operationId: listarAvaliacoes
      summary: Listar avaliações públicas ou consultar as próprias avaliações
      description: |
        A consulta pública devolve avaliações visíveis da mais recente para a mais antiga e
        aceita filtros por produtor e produto. O valor literal true em minhas muda para a
        consulta privada e exige um JWT de comprador. Nesse modo são devolvidas também as
        avaliações ocultadas do próprio comprador e os filtros públicos são ignorados.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: minhas, in: query, schema: { type: string }, example: 'true' }
        - { $ref: '#/components/parameters/Produtor' }
        - { name: produto, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses:
        '200':
          description: Lista pública de avaliações ou projeção privada das avaliações do comprador
          headers:
            Cache-Control:
              description: Presente na consulta privada
              schema: { type: string, example: 'private, no-store' }
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items: { $ref: '#/components/schemas/ReviewPublica' }
                  - type: array
                    items: { $ref: '#/components/schemas/ReviewPropria' }
              examples:
                proprias:
                  summary: Consulta com minhas=true
                  value:
                    - { _id: 66f5a1c2e4b0a1b2c3d4e5f6, encomenda: 66f5a1c2e4b0a1b2c3d4e5f7, produto: null }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '500': { $ref: '#/components/responses/ErroInterno' }
    post:
      tags: [Avaliações]
      operationId: criarAvaliacao
      summary: Avaliar um produtor ou produto após uma encomenda entregue
      description: |
        Exige papel comprador e uma encomenda própria já entregue.
        Se indicar produto, este tem de constar da encomenda; se o omitir, avalia o produtor.
        É permitida uma avaliação por combinação autor/encomenda/produto.
        O servidor obtém o autor do JWT e o produtor da encomenda.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Avaliação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewGravacao' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Encomenda inexistente ou de outro comprador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Encomenda não encontrada" }
        '409':
          description: Encomenda por entregar ou avaliação já registada para a mesma combinação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              examples:
                entrega:
                  value: { erro: "Só pode avaliar uma encomenda entregue" }
                duplicada:
                  value: { erro: "Esta encomenda ou produto já foi avaliado" }
                concorrencia:
                  value: { erro: "Já existe um registo com esses dados" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /reviews/{id}/denuncia:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Avaliações]
      operationId: denunciarAvaliacao
      summary: Denunciar uma avaliação visível
      description: |
        Qualquer utilizador autenticado pode denunciar uma avaliação visível.
        Cada conta incrementa o contador uma vez, mesmo com pedidos concorrentes.
        Uma repetição devolve 204 e mantém o contador. A ocultação cabe à moderação.
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Denúncia registada ou já efetuada pela mesma conta, sem corpo de resposta
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404':
          description: Avaliação inexistente ou oculta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Avaliação não encontrada" }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /admin/estatisticas:
    get:
      tags: [Administração]
      operationId: consultarEstatisticas
      summary: Consultar estatísticas globais
      description: |
        Exige papel admin. Conta todos os utilizadores, os produtores validados,
        as encomendas criadas hoje segundo o relógio local do servidor
        e os leilões com estado ativo e data de fim futura.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Contagens globais
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estatisticas' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /admin/produtores/pendentes:
    get:
      tags: [Administração]
      operationId: listarProdutoresPendentes
      summary: Listar produtores por validar
      description: |
        Exige papel admin. Inclui produtores pendentes e registos antigos ainda não
        validados sem estado explícito. Os rejeitados ficam fora da lista.
        Ordena por data de registo, da mais antiga para a mais recente.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Produtores com estado pendente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProdutorAdministrativo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /admin/produtores/{id}/validacao:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Administração]
      operationId: validarProdutor
      summary: Aprovar ou rejeitar um produtor pendente
      description: |
        Exige papel admin. aprovado=true grava aprovado; aprovado=false grava rejeitado.
        Só uma decisão altera um produtor pendente, mesmo com pedidos concorrentes.
        Repetir a decisão já registada devolve 200. Pedir a decisão oposta devolve 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aprovado]
              properties:
                aprovado: { type: boolean }
            example: { aprovado: true }
      responses:
        '200':
          description: Decisão aplicada ou repetição da decisão já registada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisaoProdutor' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: O identificador não corresponde a um produtor existente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Produtor não encontrado" }
        '409':
          description: Já existe uma decisão diferente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Este produtor já tem uma decisão de validação" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /admin/reviews/denunciadas:
    get:
      tags: [Administração]
      operationId: listarAvaliacoesDenunciadas
      summary: Listar avaliações visíveis com denúncias
      description: Exige papel admin. Ordena por número de denúncias decrescente.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Avaliações que aguardam moderação
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReviewAdministrativa' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /admin/reviews/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Administração]
      operationId: moderarAvaliacao
      summary: Alterar a visibilidade de uma avaliação
      description: Exige papel admin. false oculta a avaliação; true volta a publicá-la.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visivel]
              properties:
                visivel: { type: boolean }
            example: { visivel: false }
      responses:
        '200':
          description: Avaliação com visibilidade atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewGravacao' }
        '400':
          description: Identificador, JSON ou valor de visivel inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Indique visivel como true ou false" }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Avaliação inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: "Avaliação não encontrada" }
        '413': { $ref: '#/components/responses/CorpoDemasiadoGrande' }
        '500': { $ref: '#/components/responses/ErroInterno' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Obtenha o JWT em POST /auth/login e escreva apenas o token no botão Authorize.
        O Swagger envia Authorization com o esquema Bearer.
        O servidor exige assinatura HS256 válida, expiração e claims id/papel válidos.
        Um token inválido ou expirado devolve 401; um papel sem permissão devolve 403.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador MongoDB do recurso
      schema: { $ref: '#/components/schemas/ObjectId' }
    Produtor:
      name: produtor
      in: query
      description: Identificador do produtor
      schema: { $ref: '#/components/schemas/ObjectId' }
    Localidade:
      name: localidade
      in: query
      description: Localidade exata do produtor
      schema: { type: string, example: Ponte de Lima }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chave opcional para repetir o mesmo checkout do comprador.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      example: checkout_2026_001
  headers:
    CacheControlPrivado:
      description: Resposta privada sem armazenamento em cache
      schema: { type: string, example: 'private, no-store' }
    Location:
      description: Caminho relativo do recurso criado, incluindo /api
      schema: { type: string, example: /api/products/66f5a1c2e4b0a1b2c3d4e5f6 }
  responses:
    DadosInvalidos:
      description: Corpo, parâmetros, identificador ou ficheiro inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: Dados inválidos }
    NaoAutenticado:
      description: JWT em falta, inválido ou expirado; em /auth/eu também ocorre quando a conta já não existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: Token inválido ou em falta }
    SemPermissao:
      description: O papel do utilizador não permite esta operação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: Sem permissão }
    ErroInterno:
      description: Erro inesperado, sem exposição de detalhes internos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: Erro interno }
    CorpoDemasiadoGrande:
      description: O corpo JSON excede o limite de 1 MiB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { erro: request entity too large }
    SemConteudo:
      description: Operação concluída, sem corpo de resposta
    ProdutoDetalhe:
      description: Produto público com os dados selecionados do produtor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductDetalhe' }
    ProdutoGravado:
      description: Produto atualizado, com o produtor identificado por ID
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductGravacao' }
    Encomenda:
      description: Encomenda com comprador e produtor preenchidos e total calculado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderLeitura' }
    EncomendaGravada:
      description: Encomenda atualizada, com referências por ID e total calculado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderGravacao' }

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 66f5a1c2e4b0a1b2c3d4e5f6
    ObjectIdNullable:
      type: string
      nullable: true
      pattern: '^[a-fA-F0-9]{24}$'
    Registo:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    Erro:
      type: object
      required: [erro]
      properties:
        erro: { type: string }
        detalhes:
          type: object
          description: Mensagens de validação por campo, quando disponíveis
          additionalProperties: { type: string }
    EstadoValidacaoProdutor:
      type: string
      enum: [pendente, aprovado, rejeitado]
    PerfilProdutor:
      type: object
      properties:
        nomeExploracao: { type: string, example: Horta da Ribeira }
        descricao: { type: string, maxLength: 1000 }
        localidade: { type: string, example: Ponte de Lima }
        localizacao:
          type: object
          properties:
            lat: { type: number, example: 41.767 }
            lng: { type: number, example: -8.583 }
        validado: { type: boolean, readOnly: true, description: Indicador de aprovação }
        estadoValidacao: { $ref: '#/components/schemas/EstadoValidacaoProdutor' }
    PerfilProdutorNormalizado:
      description: |
        Para registos antigos sem estado explícito, validado=true é interpretado como
        aprovado e os restantes como pendente. A normalização na leitura não grava dados.
      allOf:
        - { $ref: '#/components/schemas/PerfilProdutor' }
        - type: object
          required: [validado, estadoValidacao]
    PerfilProdutorUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        Os valores são aparados antes da gravação. Nome, exploração e localidade exigem
        texto não vazio quando enviados. Envie descricao vazia para a limpar.
      properties:
        nome: { type: string, maxLength: 100, pattern: '\S' }
        nomeExploracao: { type: string, pattern: '\S' }
        localidade: { type: string, pattern: '\S' }
        descricao: { type: string, maxLength: 1000 }
    ProdutorPublico:
      type: object
      required: [_id, nome, produtor]
      description: Projeção pública do perfil guardado. Em registos antigos, estadoValidacao pode estar ausente.
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        nome: { type: string, maxLength: 100 }
        produtor: { $ref: '#/components/schemas/PerfilProdutor' }
    ProdutorAdministrativo:
      type: object
      required: [_id, nome, email, produtor]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        nome: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        produtor: { $ref: '#/components/schemas/PerfilProdutorNormalizado' }
    DecisaoProdutor:
      allOf:
        - { $ref: '#/components/schemas/ProdutorAdministrativo' }
        - type: object
          properties:
            updatedAt: { type: string, format: date-time }
    ReferenciaComNome:
      type: object
      nullable: true
      required: [_id, nome]
      description: Referência preenchida com o nome, ou null se o documento referenciado já não existir.
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        nome: { type: string }
    ReferenciaProdutorComLocalidade:
      type: object
      nullable: true
      required: [_id, nome]
      description: Referência preenchida do produtor, ou null se o produtor já não existir.
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        nome: { type: string }
        produtor:
          type: object
          properties:
            localidade: { type: string }
    UserPublico:
      type: object
      required: [id, nome, email, papel]
      description: Dados da própria conta, devolvidos pelo login, por /auth/eu e pela atualização do perfil.
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        nome: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        papel: { type: string, enum: [comprador, produtor, admin] }
        produtor:
          description: Perfil presente apenas para contas com papel produtor.
          allOf:
            - { $ref: '#/components/schemas/PerfilProdutorNormalizado' }
      example:
        id: 66f5a1c2e4b0a1b2c3d4e5f6
        nome: Horta da Ribeira
        email: horta@exemplo.pt
        papel: produtor
        produtor:
          nomeExploracao: Horta da Ribeira
          localidade: Ponte de Lima
          validado: true
          estadoValidacao: aprovado
    RegistoInput:
      type: object
      required: [nome, email, password]
      description: Nome e email são normalizados; o perfil da exploração só é usado quando papel=produtor.
      oneOf:
        - properties:
            papel: { type: string, enum: [comprador] }
        - required: [papel, produtor]
          properties:
            papel: { type: string, enum: [produtor] }
            produtor: { $ref: '#/components/schemas/ProdutorRegistoInput' }
      properties:
        nome: { type: string, minLength: 1, maxLength: 100, pattern: '\S', example: Maria Silva }
        email: { type: string, format: email, example: maria@exemplo.pt }
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          description: Pelo menos 8 caracteres e no máximo 72 bytes em UTF-8; não é aparada nem guardada em claro
          example: password123
        papel: { type: string, enum: [comprador, produtor], default: comprador }
        produtor:
          description: Dados da exploração, obrigatórios no papel produtor e ignorados no papel comprador
    ProdutorRegistoInput:
      type: object
      required: [nomeExploracao, localidade]
      description: O servidor usa estes dois campos e define o estado pendente com validado=false.
      properties:
        nomeExploracao: { type: string, minLength: 1, pattern: '\S', example: Horta da Ribeira }
        localidade: { type: string, minLength: 1, pattern: '\S', example: Ponte de Lima }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, pattern: '\S', description: Comparado após retirar espaços nas extremidades e converter para minúsculas, example: horta@exemplo.pt }
        password: { type: string, format: password, minLength: 1, writeOnly: true, description: Comparada sem retirar espaços; mais de 72 bytes em UTF-8 devolve 401, example: password123 }
    Sessao:
      type: object
      required: [token, utilizador]
      properties:
        token: { type: string, description: JWT HS256 com id/papel/nome e expiração; duas horas por omissão }
        utilizador: { $ref: '#/components/schemas/UserPublico' }
    Categoria:
      type: string
      enum: [Hortícolas, Fruta, Mel, Vinho, Queijo, Padaria, Outros]
      example: Fruta
    Epoca:
      type: string
      enum: [Primavera, Verão, Outono, Inverno]
      example: Outono
    ProductUpdate:
      type: object
      minProperties: 1
      anyOf:
        - required: [nome]
        - required: [descricao]
        - required: [categoria]
        - required: [preco]
        - required: [unidade]
        - required: [stock]
        - required: [biologico]
        - required: [epocas]
      description: Campos editáveis; os restantes campos enviados são ignorados.
      properties:
        nome: { type: string, pattern: '\S', example: Kiwi Hayward }
        descricao: { type: string, nullable: true, maxLength: 1000 }
        categoria: { $ref: '#/components/schemas/Categoria' }
        preco: { $ref: '#/components/schemas/PrecoEmCentimos' }
        unidade: { type: string, nullable: true, default: kg }
        stock: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0, example: 300 }
        biologico: { type: boolean, default: false }
        epocas:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Epoca' }
    ProductInput:
      allOf:
        - { $ref: '#/components/schemas/ProductUpdate' }
        - type: object
          required: [nome, categoria, preco]
    PrecoEmCentimos:
      type: number
      minimum: 0
      maximum: 90071992547409.91
      multipleOf: 0.01
      description: |
        Valor em euros com até duas casas decimais. Aceita zero.
        A API exige que o valor convertido em cêntimos seja um inteiro seguro
        e que o valor em euros mantenha a precisão às duas casas decimais.
    Product:
      allOf:
        - { $ref: '#/components/schemas/Registo' }
        - type: object
          required: [_id, nome, categoria, preco]
          properties:
            nome: { type: string }
            descricao: { type: string, nullable: true, maxLength: 1000 }
            categoria: { $ref: '#/components/schemas/Categoria' }
            preco: { type: number, minimum: 0 }
            unidade: { type: string, nullable: true }
            stock: { type: integer, nullable: true, minimum: 0, maximum: 9007199254740991 }
            biologico: { type: boolean }
            epocas:
              type: array
              nullable: true
              items: { $ref: '#/components/schemas/Epoca' }
            imagemUrl: { type: string, format: uri }
    ProductGravacao:
      allOf:
        - { $ref: '#/components/schemas/Product' }
        - type: object
          required: [produtor]
          properties:
            produtor: { $ref: '#/components/schemas/ObjectId' }
    ProductLista:
      allOf:
        - { $ref: '#/components/schemas/Product' }
        - type: object
          required: [produtor]
          properties:
            produtor:
              type: object
              nullable: true
              required: [_id, nome]
              properties:
                _id: { $ref: '#/components/schemas/ObjectId' }
                nome: { type: string }
                produtor:
                  type: object
                  properties:
                    localidade: { type: string }
                    nomeExploracao: { type: string }
    ProductDetalhe:
      allOf:
        - { $ref: '#/components/schemas/Product' }
        - type: object
          required: [produtor]
          properties:
            produtor:
              type: object
              required: [_id, nome, produtor]
              properties:
                _id: { $ref: '#/components/schemas/ObjectId' }
                nome: { type: string }
                produtor:
                  type: object
                  required: [validado]
                  properties:
                    localidade: { type: string }
                    nomeExploracao: { type: string }
                    validado: { type: boolean, enum: [true] }
    ProductDeProdutor:
      allOf:
        - { $ref: '#/components/schemas/Product' }
        - type: object
          required: [produtor]
          properties:
            produtor: { $ref: '#/components/schemas/ReferenciaProdutorComLocalidade' }
    ProdutoResumoLeilao:
      type: object
      nullable: true
      required: [_id, nome]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        nome: { type: string }
        unidade: { type: string, nullable: true }
        imagemUrl: { type: string, format: uri }
    PaginaProdutor:
      type: object
      required: [produtor, produtos, avaliacaoMedia, totalAvaliacoes, avaliacoes]
      properties:
        produtor: { $ref: '#/components/schemas/ProdutorPublico' }
        produtos:
          type: array
          items: { $ref: '#/components/schemas/ProductDeProdutor' }
        avaliacaoMedia: { type: number, nullable: true, minimum: 1, maximum: 5, example: 4.5 }
        totalAvaliacoes: { type: integer, minimum: 0 }
        avaliacoes:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ReviewPaginaProdutor' }
    EstadoEncomenda:
      type: string
      enum: [pendente, confirmada, pronta, entregue]
    EntregaInput:
      type: object
      description: Por omissão usa levantamento. Uma morada de levantamento, se enviada, é descartada.
      properties:
        tipo: { type: string, enum: [levantamento, entrega], default: levantamento }
        morada: { type: string, example: 'Rua de exemplo, Ponte de Lima' }
      oneOf:
        - properties:
            tipo: { type: string, enum: [levantamento] }
        - required: [tipo, morada]
          properties:
            tipo: { type: string, enum: [entrega] }
            morada: { type: string, pattern: '\S' }
    Entrega:
      type: object
      required: [tipo]
      description: Na recolha, a morada fica vazia no checkout e pode estar ausente nas encomendas de leilão.
      properties:
        tipo: { type: string, enum: [levantamento, entrega] }
        morada: { type: string, example: 'Rua de exemplo, Ponte de Lima' }
    OrderLineInput:
      type: object
      required: [produto, quantidade]
      properties:
        produto: { $ref: '#/components/schemas/ObjectId' }
        quantidade: { type: integer, minimum: 1, maximum: 9007199254740991, example: 2 }
    OrderInput:
      type: object
      required: [linhas]
      properties:
        linhas:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLineInput' }
        entrega: { $ref: '#/components/schemas/EntregaInput' }
    OrderLine:
      type: object
      required: [_id, id, nome, precoUnit, quantidade]
      description: Cópia dos dados no momento da compra. Nas encomendas de leilão, a linha representa um lote e o produto pode estar ausente.
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        id: { $ref: '#/components/schemas/ObjectId' }
        produto: { $ref: '#/components/schemas/ObjectId' }
        nome: { type: string }
        precoUnit: { type: number, minimum: 0 }
        unidade: { type: string, nullable: true }
        quantidade: { type: integer, minimum: 1, maximum: 9007199254740991 }
    Order:
      allOf:
        - { $ref: '#/components/schemas/Registo' }
        - type: object
          required: [_id, id, linhas, estado, entrega, origem, total]
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            linhas:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/OrderLine' }
            estado: { $ref: '#/components/schemas/EstadoEncomenda' }
            entrega: { $ref: '#/components/schemas/Entrega' }
            origem: { type: string, enum: [loja, leilao], description: A origem leilao é criada automaticamente para o vencedor }
            leilao: { $ref: '#/components/schemas/ObjectId' }
            total: { type: number, minimum: 0, readOnly: true, description: Soma de precoUnit vezes quantidade arredondada a duas casas decimais }
    OrderLeitura:
      allOf:
        - { $ref: '#/components/schemas/Order' }
        - type: object
          required: [comprador, produtor]
          properties:
            comprador: { $ref: '#/components/schemas/ReferenciaComNome' }
            produtor: { $ref: '#/components/schemas/ReferenciaProdutorComLocalidade' }
    OrderGravacao:
      allOf:
        - { $ref: '#/components/schemas/Order' }
        - type: object
          required: [comprador, produtor]
          properties:
            comprador: { $ref: '#/components/schemas/ObjectId' }
            produtor: { $ref: '#/components/schemas/ObjectId' }
    EstadoLeilao:
      type: string
      enum: [agendado, ativo, terminado]
    AuctionInput:
      type: object
      required: [lote, precoBase, incremento]
      anyOf:
        - required: [duracao]
        - required: [terminaEm]
      properties:
        produto: { $ref: '#/components/schemas/ObjectIdNullable' }
        lote: { type: string, pattern: '\S', maxLength: 150, example: '200 kg de kiwi Hayward, calibre A' }
        descricao: { type: string, nullable: true, maxLength: 1000 }
        quantidade: { type: string, nullable: true, example: 200 kg }
        precoBase:
          allOf:
            - { $ref: '#/components/schemas/PrecoEmCentimos' }
          example: 200
        incremento:
          allOf:
            - { $ref: '#/components/schemas/PrecoEmCentimos' }
            - { type: number, minimum: 0.01 }
          example: 5
        iniciaEm: { type: string, format: date-time, description: Omitir para começar agora }
        terminaEm: { type: string, format: date-time, description: Obrigatório se duracao for omitida }
        duracao:
          description: Duração em minutos, também aceite como texto numérico; tem prioridade sobre terminaEm
          anyOf:
            - { type: number, minimum: 1, example: 30 }
            - { type: string, minLength: 1, description: Texto convertível em número finito igual ou superior a 1, example: '30' }
    Auction:
      allOf:
        - { $ref: '#/components/schemas/Registo' }
        - type: object
          required: [_id, lote, precoBase, incremento, numLicitacoes, iniciaEm, terminaEm, estado]
          properties:
            lote: { type: string, maxLength: 150 }
            descricao: { type: string, nullable: true, maxLength: 1000 }
            quantidade: { type: string, nullable: true }
            precoBase: { type: number, minimum: 0 }
            incremento: { type: number, minimum: 0.01 }
            licitacaoAtual:
              type: object
              description: Começa com o preço base. Os dados do comprador e a data surgem após uma licitação aceite.
              properties:
                valor: { type: number, minimum: 0 }
                comprador: { $ref: '#/components/schemas/ObjectId' }
                nome: { type: string }
                em: { type: string, format: date-time }
            numLicitacoes: { type: integer, minimum: 0 }
            iniciaEm: { type: string, format: date-time }
            terminaEm: { type: string, format: date-time }
            estado: { $ref: '#/components/schemas/EstadoLeilao' }
            encomenda:
              description: ID da encomenda confirmada do vencedor, quando criada. A consulta da encomenda exige titularidade.
              allOf:
                - { $ref: '#/components/schemas/ObjectId' }
    AuctionGravacao:
      allOf:
        - { $ref: '#/components/schemas/Auction' }
        - type: object
          required: [produtor]
          properties:
            produtor: { $ref: '#/components/schemas/ObjectId' }
            produto: { $ref: '#/components/schemas/ObjectIdNullable' }
    AuctionLeitura:
      allOf:
        - { $ref: '#/components/schemas/Auction' }
        - type: object
          required: [produtor]
          properties:
            produtor: { $ref: '#/components/schemas/ReferenciaProdutorComLocalidade' }
            produto: { $ref: '#/components/schemas/ProdutoResumoLeilao' }
    AuctionDetalhe:
      allOf:
        - { $ref: '#/components/schemas/AuctionLeitura' }
        - type: object
          required: [historico]
          properties:
            historico:
              type: array
              maxItems: 20
              description: Licitações mais recentes, com desempate por ID decrescente.
              items: { $ref: '#/components/schemas/BidHistorico' }
    BidBase:
      allOf:
        - { $ref: '#/components/schemas/Registo' }
        - type: object
          required: [_id, leilao, valor]
          properties:
            leilao: { $ref: '#/components/schemas/ObjectId' }
            nome: { type: string, description: Nome guardado no momento da licitação }
            valor: { type: number, minimum: 0 }
    Bid:
      allOf:
        - { $ref: '#/components/schemas/BidBase' }
        - type: object
          required: [comprador]
          properties:
            comprador: { $ref: '#/components/schemas/ReferenciaComNome' }
    BidHistorico:
      allOf:
        - { $ref: '#/components/schemas/BidBase' }
        - type: object
          required: [comprador, data]
          properties:
            comprador: { type: string, description: Nome atual do comprador ou Comprador se a referência já não existir }
            data: { type: string, format: date-time, description: Cópia de createdAt }
    ReviewInput:
      type: object
      required: [encomenda, classificacao]
      properties:
        encomenda: { $ref: '#/components/schemas/ObjectId' }
        produto: { $ref: '#/components/schemas/ObjectId' }
        classificacao: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comentario: { type: string, maxLength: 1000, example: Produtos frescos e entrega pontual. }
    Review:
      allOf:
        - { $ref: '#/components/schemas/Registo' }
        - type: object
          required: [_id, encomenda, classificacao, denuncias, visivel]
          properties:
            encomenda: { $ref: '#/components/schemas/ObjectId' }
            classificacao: { type: integer, minimum: 1, maximum: 5 }
            comentario: { type: string, maxLength: 1000 }
            denuncias: { type: integer, minimum: 0 }
            visivel: { type: boolean }
    ReviewGravacao:
      allOf:
        - { $ref: '#/components/schemas/Review' }
        - type: object
          required: [autor, produtor]
          properties:
            autor: { $ref: '#/components/schemas/ObjectId' }
            produtor: { $ref: '#/components/schemas/ObjectId' }
            produto: { $ref: '#/components/schemas/ObjectIdNullable' }
    ReviewAdministrativa:
      allOf:
        - { $ref: '#/components/schemas/Review' }
        - type: object
          required: [autor, produtor]
          properties:
            autor: { $ref: '#/components/schemas/ReferenciaComNome' }
            produtor: { $ref: '#/components/schemas/ReferenciaComNome' }
            produto: { $ref: '#/components/schemas/ObjectIdNullable' }
    ReviewPublica:
      allOf:
        - { $ref: '#/components/schemas/Review' }
        - type: object
          required: [autor, produtor]
          properties:
            autor: { $ref: '#/components/schemas/ReferenciaComNome' }
            produtor: { $ref: '#/components/schemas/ReferenciaComNome' }
            produto: { $ref: '#/components/schemas/ReferenciaComNome' }
    ReviewPaginaProdutor:
      allOf:
        - { $ref: '#/components/schemas/Review' }
        - type: object
          required: [autor, produtor]
          properties:
            autor: { type: string, description: Nome do autor ou Comprador se a referência já não existir }
            produtor: { $ref: '#/components/schemas/ObjectId' }
            produto: { $ref: '#/components/schemas/ObjectIdNullable' }
            texto: { type: string, description: Cópia de comentario quando presente }
            denunciadaPorMim: { type: boolean, description: Presente apenas quando foi apresentado um JWT válido }
    ReviewPropria:
      type: object
      additionalProperties: false
      required: [_id, encomenda]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        encomenda: { $ref: '#/components/schemas/ObjectId' }
        produto: { $ref: '#/components/schemas/ObjectIdNullable' }
    Estatisticas:
      type: object
      required: [utilizadores, produtores, encomendasHoje, leiloesAtivos]
      properties:
        utilizadores: { type: integer, minimum: 0 }
        produtores: { type: integer, minimum: 0 }
        encomendasHoje: { type: integer, minimum: 0 }
        leiloesAtivos: { type: integer, minimum: 0 }
